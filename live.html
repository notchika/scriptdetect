<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Output</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
  }

  .slide {
    width: 90%;
    max-width: 1600px;
    text-align: center;
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .slide.visible {
    opacity: 1;
    transform: scale(1);
  }

  .verse-text {
    font-size: clamp(2.2rem, 5vw, 4.2rem);
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.4;
    margin-bottom: 2rem;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  .verse-ref {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1.1rem, 2.2vw, 1.6rem);
    font-weight: 500;
    color: #C9A84C;
    letter-spacing: 0.05em;
  }

  .verse-translation {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  /* Blackout state — pure black, nothing rendered */
  .blank-hint {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="slide" id="slide">
  <div class="verse-text" id="verseText"></div>
  <div class="verse-ref" id="verseRef"></div>
  <div class="verse-translation" id="verseTranslation"></div>
</div>

<div class="blank-hint">Scripture Detector — Live Output</div>

<script>
const POLL_INTERVAL = 1000; // check for live slide changes every second
let currentRef = null;

async function poll() {
  try {
    const res = await fetch('/live/current');
    if (!res.ok) return;

    const data = await res.json();
    const slideEl = document.getElementById('slide');

    if (!data || !data.visible || !data.reference) {
      // Blackout — clear screen
      if (currentRef !== null) {
        slideEl.classList.remove('visible');
        currentRef = null;
      }
      return;
    }

    // Only re-render if the content actually changed
    if (data.reference !== currentRef) {
      currentRef = data.reference;
      document.getElementById('verseText').textContent = data.text || '';
      document.getElementById('verseRef').textContent = data.reference || '';
      document.getElementById('verseTranslation').textContent = data.translation || '';
      slideEl.classList.add('visible');
    }
  } catch (e) {
    // Silent fail — server might be restarting, just keep polling
  }
}

poll();
setInterval(poll, POLL_INTERVAL);

// Press F to toggle fullscreen — convenient for the operator on the projector machine
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
});
</script>
</body>
</html>
